<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q.LIGHTING 재고관리 시스템</title>
    <style>
      html, body, #root { overflow-x: hidden; }
      * { box-sizing: border-box; }

      .spin { animation: qlspin 0.8s linear infinite; }
      @keyframes qlspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* 특정 영역만 인쇄하기 위한 규칙: 인쇄할 요소에 .print-target 을 붙이고
         body에 .print-mode-active 를 잠깐 붙였다가 인쇄 후 제거합니다. */
      @media print {
        body.print-mode-active * { visibility: hidden !important; }
        body.print-mode-active .print-target,
        body.print-mode-active .print-target * { visibility: visible !important; }
        body.print-mode-active .print-target {
          position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 12px;
        }
        body.print-mode-active .no-print { display: none !important; }
      }

      /* 표는 화면이 좁으면 글자가 눌리는 대신 좌우로 스크롤되게 */
      .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

      /* 모바일 화면(폭 820px 이하)용 레이아웃 */
      @media (max-width: 820px) {
        .app-shell { flex-direction: column !important; }
        .app-sidebar {
          width: 100% !important;
          min-height: auto !important;
          display: flex !important;
          flex-direction: row !important;
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch;
          padding: 8px !important;
          border-right: none !important;
          border-bottom: 1px solid #EEF0F3 !important;
          gap: 4px;
        }
        .app-sidebar > button { white-space: nowrap; flex-shrink: 0; margin-bottom: 0 !important; width: auto !important; }
        .app-sidebar .sidebar-footer { display: none !important; }
        .app-content { padding: 14px !important; }
        .app-header { padding: 0 14px !important; flex-wrap: wrap; height: auto !important; min-height: 54px; }
        .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
        .modal-box { width: 94vw !important; max-width: 94vw !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
